<!doctype html>
<!-- Page de probe DEV : rend les vues de l'écran de ligne (dalle droite des
     doubles écrans au-dessus des portes) hors du monde 3D, à leur résolution
     native de 768 × 432, pour les comparer au pixel avec des captures de
     l'afficheur réel.

     /lcd-probe.html?station=0&phase=dwell     (東京, à quai)
     /lcd-probe.html?station=1&phase=cruise    (次は 神田)

     Les vues portent le nom de ce qu'elles MONTRENT, pas celui de la langue du
     passage : `exit-transfers` et `exit-doors-*` sont deux compositions
     différentes du plan des sorties, et non deux traductions l'une de l'autre.
     Les états qui dépendent du moment du trajet sont rendus aux DEUX moments
     (`-dwell` / `-cruise`), sans quoi on ne voit jamais changer le bandeau.

     Chaque vue est empilée sous son titre ; scripts/lcd-shots.mjs les capture
     une à une. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>lcd-probe - écrans de ligne à l'échelle</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #14171c;
        color: #cfd6df;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      figure {
        margin: 0 0 20px;
      }
      figcaption {
        padding: 4px 0;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="out"></div>
    <script type="module">
      import {
        drawRoute, drawLoopMap, drawTransfers, drawExitTransfers, drawExitDoors,
        drawEmergencyInfo, drawEmergencyBrake, drawOutageInfo, drawTrafficInfo, drawSecurityNotice,
        drawPriorityNotice, drawPhoneManner,
      } from '/src/three/lineScreen.ts';
      import { makeScreen } from '/src/three/screenSurface.ts';
      import { drawWeatherPanel } from '/src/three/adScreen.ts';

      const q = new URLSearchParams(location.search);
      const station = Number(q.get('station') ?? 0);
      const phase = q.get('phase') ?? 'dwell';
      const clock = q.get('clock') ?? '0:00';
      const dir = q.get('dir') === 'outer' ? 'outer' : 'inner';
      const countdown = Number(q.get('countdown') ?? 0);
      const status = phase === 'dwell' ? 'now' : phase === 'brake' ? 'soon' : 'next';

      const NOTICE = {
        lineJp: '高崎線', lineEn: 'Takasaki Line',
        reasonJp: '踏切安全確認', reasonEn: 'a crossing safety check',
      };

      const WX = [
        { minute: 900, dayOffset: 0, kind: 'overcast', tempC: 15 },
        { minute: 1080, dayOffset: 0, kind: 'rain', tempC: 11 },
        { minute: 1260, dayOffset: 0, kind: 'rain', tempC: 9 },
        { minute: 0, dayOffset: 1, kind: 'thunder', tempC: 9 },
        { minute: 180, dayOffset: 1, kind: 'overcast', tempC: 9 },
        { minute: 360, dayOffset: 1, kind: 'fair', tempC: 10 },
      ];

      // Les vues portent le nom de l'ÉTAT qu'elles rendent, dans l'ordre où la
      // machine à états le décrit : écran, puis mode, puis statut, puis langue.
      // `station-layout-transfers-now-jp` se lit donc comme la frame
      // { state:'stationLayout', mode:'transfers', status:'now', lang:'jp' } -
      // celle de la figure 6 de la revue Hitachi.
      const views = [
        // --- Plans de ligne : les deux moments, puis les versions anglaises.
        // Le plan rapproché ne dit pas la même chose à quai (jeton « vous êtes
        // ici », ただいま) et en circulation (chevron, 次は) : les deux sont
        // rendus quelle que soit la phase demandée en query.
        ['zoom-now-jp', (s) => drawRoute(s, station, 'dwell', 0, clock, 'now', 'jp', dir)],
        ['zoom-next-jp', (s) => drawRoute(s, station, 'cruise', countdown, clock, 'next', 'jp', dir)],
        ['zoom-next-en', (s) => drawRoute(s, station, 'cruise', countdown, clock, 'next', 'en', dir)],
        // Le remplissage du ruban, à l'arrivée de l'écran : la bande est
        // d'abord éteinte sur toute sa longueur et le vert la remonte depuis le
        // repère de position. C'est une animation, elle ne se juge pas sur une
        // image - mais la COUPE, elle, se juge image par image : elle doit être
        // franche et normale à la bande, liseré compris.
        ['zoom-fill-00', (s) => drawRoute(s, station, 'dwell', 0, clock, 'now', 'jp', dir, 0, 0)],
        ['zoom-fill-25', (s) => drawRoute(s, station, 'dwell', 0, clock, 'now', 'jp', dir, 0, 0.25)],
        ['zoom-fill-55', (s) => drawRoute(s, station, 'dwell', 0, clock, 'now', 'jp', dir, 0, 0.55)],
        ['zoom-fill-85', (s) => drawRoute(s, station, 'dwell', 0, clock, 'now', 'jp', dir, 0, 0.85)],
        // Et dans l'autre sens de marche, où la bande est en miroir : la coupe
        // doit toujours partir du repère de position, pas du bord de l'écran.
        [
          'zoom-fill-55-outer',
          (s) => drawRoute(s, station, 'dwell', 0, clock, 'now', 'jp', 'outer', 0, 0.55),
        ],
        ['loop-now-jp', (s) => drawLoopMap(s, station, 'dwell', 0, clock, 'now', 'jp', dir)],
        ['loop-next-jp', (s) => drawLoopMap(s, station, 'cruise', countdown, clock, 'next', 'jp', dir)],
        ['loop-next-en', (s) => drawLoopMap(s, station, 'cruise', countdown, clock, 'next', 'en', dir)],
        // La phase passée en query, pour comparer une capture à un instant
        // précis sans changer de vue.
        ['zoom-query-jp', (s) => drawRoute(s, station, phase, countdown, clock, status, 'jp', dir)],
        ['loop-query-jp', (s) => drawLoopMap(s, station, phase, countdown, clock, status, 'jp', dir)],

        // --- Écran de correspondances PLEIN CADRE. À ne pas confondre avec le
        // plan des sorties dont le bas porte les correspondances : ce sont deux
        // écrans distincts du cycle.
        ['transfers-full-next-jp', (s) => drawTransfers(s, station, clock, dir, 'next')],

        // --- Plan des sorties, mode « correspondances ». La langue ne porte que
        // le BANDEAU : sous lui, portillons et lignes sont bilingues dans les
        // deux passages, comme sur les deux images de la figure 6. Les quatre
        // combinaisons de statut et de langue sont attestées pour ce mode.
        ['station-layout-transfers-next-jp', (s) => drawExitTransfers(s, station, clock, 'jp', dir, 2, 'next')],
        ['station-layout-transfers-next-en', (s) => drawExitTransfers(s, station, clock, 'en', dir, 2, 'next')],
        ['station-layout-transfers-now-jp', (s) => drawExitTransfers(s, station, clock, 'jp', dir, 2, 'now')],
        ['station-layout-transfers-now-en', (s) => drawExitTransfers(s, station, clock, 'en', dir, 2, 'now')],

        // --- Plan des sorties, mode « portes », sous まもなく. Seul écran du
        // cycle qui diffère d'une paroi à l'autre : la dalle du côté qui s'ouvre
        // dit こちら側, celle d'en face 反対側. Aucune version anglaise : la
        // ligne anglaise sous le japonais fait partie de la capture, ce n'est
        // pas un passage du cycle.
        ['station-layout-doors-this-side-soon-jp', (s) => drawExitDoors(s, station, clock, true, dir, 2, 'soon')],
        ['station-layout-doors-other-side-soon-jp', (s) => drawExitDoors(s, station, clock, false, dir, 2, 'soon')],
        // Le pictogramme de porte (vantaux + triangle de la voiture du joueur)
        // au fil de son cycle. Ce n'est plus une suite de quatre images posées
        // au battement mais un GESTE CONTINU de deux secondes : on l'échantillonne
        // donc au quart de phase, ce qui en donne seize instantanés - assez
        // rapprochés pour qu'un ressaut de l'écartement se voie d'une vignette à
        // la suivante. L'animation, elle, ne se juge toujours pas sur une image ;
        // c'est sa RÉGULARITÉ qui se juge ici.
        ...Array.from({ length: 16 }, (_, i) => [
          `station-layout-doors-anim${String(i).padStart(2, '0')}`,
          (s) => drawExitDoors(s, station, clock, true, dir, i / 4, 'soon'),
        ]),

        // --- Avis de secteur (ne passent que sur certains intervalles, et sur
        // des intervalles APPROCHÉS : voir NOTICE_SEGMENTS).
        ['security-next-jp', (s) => drawSecurityNotice(s, station, clock, 'jp', dir, 'next')],
        ['security-next-en', (s) => drawSecurityNotice(s, station, clock, 'en', dir, 'next')],
        ['priority-seats-next-jp', (s) => drawPriorityNotice(s, station, clock, dir, 'next')],
        ['manner-mode-next-jp', (s) => drawPhoneManner(s, station, clock, dir, 'next')],

        // --- Information trafic : deux pages qui se suivent. Le bandeau prend
        // le statut RÉEL du moment - il disait 「ただいま」 en dur, en pleine
        // croisière. La vue `now` n'est là que pour vérifier ce point : cet avis
        // ne s'insère pas dans la rotation à quai.
        ['traffic-next-jp', (s) => drawTrafficInfo(s, station, clock, 'next', 'jp', NOTICE, dir)],
        ['traffic-next-en', (s) => drawTrafficInfo(s, station, clock, 'next', 'en', NOTICE, dir)],
        ['traffic-now-jp', (s) => drawTrafficInfo(s, station, clock, 'now', 'jp', NOTICE, dir)],

        // --- Écrans d'incident : ils remplacent toute la rotation.
        ['emergency-brake', (s) => drawEmergencyBrake(s)],
        ['emergency-suspended', (s) => drawEmergencyInfo(s)],
        ['emergency-outage', (s) => drawOutageInfo(s)],

        // --- Écran gauche, pour mémoire.
        ['weather', (s) => drawWeatherPanel(s, WX, { year: 2026, month: 4, day: 27 }, 28)],
      ];

      const out = document.getElementById('out');
      for (const [name, draw] of views) {
        const s = makeScreen(768, 432);
        draw(s);
        const fig = document.createElement('figure');
        const cap = document.createElement('figcaption');
        cap.textContent = name;
        fig.append(cap, s.g.canvas);
        s.g.canvas.dataset.view = name;
        out.append(fig);
      }
    </script>
  </body>
</html>
