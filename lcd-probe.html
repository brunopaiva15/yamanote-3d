<!doctype html>
<!-- Page de probe DEV : rend les vues de l'écran de ligne (dalle droite des
     doubles écrans au-dessus des portes) hors du monde 3D, à leur résolution
     native de 768 × 432, pour les comparer au pixel avec des captures de
     l'afficheur réel.

     /lcd-probe.html?station=0&phase=dwell     (東京, à quai)
     /lcd-probe.html?station=1&phase=cruise    (次は 神田)

     Les vues portent le nom de ce qu'elles MONTRENT, pas celui de la langue du
     passage : `exit-transfers` et `exit-doors-*` sont deux compositions
     différentes du plan des sorties, et non deux traductions l'une de l'autre.
     Les états qui dépendent du moment du trajet sont rendus aux DEUX moments
     (`-dwell` / `-cruise`), sans quoi on ne voit jamais changer le bandeau.

     Chaque vue est empilée sous son titre ; scripts/lcd-shots.mjs les capture
     une à une. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>lcd-probe - écrans de ligne à l'échelle</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #14171c;
        color: #cfd6df;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      figure {
        margin: 0 0 20px;
      }
      figcaption {
        padding: 4px 0;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="out"></div>
    <script type="module">
      import {
        drawRoute, drawLoopMap, drawTransfers, drawExitTransfers, drawExitDoors,
        drawEmergencyInfo, drawEmergencyBrake, drawOutageInfo, drawTrafficInfo, drawSecurityNotice,
        drawPriorityNotice, drawPhoneManner,
      } from '/src/three/lineScreen.ts';
      import { makeScreen } from '/src/three/screenSurface.ts';
      import { drawWeatherPanel } from '/src/three/adScreen.ts';

      const q = new URLSearchParams(location.search);
      const station = Number(q.get('station') ?? 0);
      const phase = q.get('phase') ?? 'dwell';
      const clock = q.get('clock') ?? '0:00';
      const dir = q.get('dir') === 'outer' ? 'outer' : 'inner';
      const countdown = Number(q.get('countdown') ?? 0);
      const status = phase === 'dwell' ? 'now' : phase === 'brake' ? 'soon' : 'next';

      const NOTICE = {
        lineJp: '高崎線', lineEn: 'Takasaki Line',
        reasonJp: '踏切安全確認', reasonEn: 'a crossing safety check',
      };

      const WX = [
        { minute: 900, dayOffset: 0, kind: 'overcast', tempC: 15 },
        { minute: 1080, dayOffset: 0, kind: 'rain', tempC: 11 },
        { minute: 1260, dayOffset: 0, kind: 'rain', tempC: 9 },
        { minute: 0, dayOffset: 1, kind: 'thunder', tempC: 9 },
        { minute: 180, dayOffset: 1, kind: 'overcast', tempC: 9 },
        { minute: 360, dayOffset: 1, kind: 'fair', tempC: 10 },
      ];

      const views = [
        // --- Plans de ligne : les deux moments, puis les versions anglaises.
        // Le plan rapproché ne dit pas la même chose à quai (jeton « vous êtes
        // ici », ただいま) et en circulation (chevron, 次は) : les deux sont
        // rendus quelle que soit la phase demandée en query.
        ['zoom-jp-dwell', (s) => drawRoute(s, station, 'dwell', 0, clock, 'now', 'jp', dir)],
        ['zoom-jp-cruise', (s) => drawRoute(s, station, 'cruise', countdown, clock, 'next', 'jp', dir)],
        ['zoom-en-cruise', (s) => drawRoute(s, station, 'cruise', countdown, clock, 'next', 'en', dir)],
        ['loop-jp-dwell', (s) => drawLoopMap(s, station, 'dwell', 0, clock, 'now', 'jp', dir)],
        ['loop-jp-cruise', (s) => drawLoopMap(s, station, 'cruise', countdown, clock, 'next', 'jp', dir)],
        ['loop-en-cruise', (s) => drawLoopMap(s, station, 'cruise', countdown, clock, 'next', 'en', dir)],
        // La phase passée en query, pour comparer une capture à un instant
        // précis sans changer de vue.
        ['zoom-jp-query', (s) => drawRoute(s, station, phase, countdown, clock, status, 'jp', dir)],
        ['loop-jp-query', (s) => drawLoopMap(s, station, phase, countdown, clock, status, 'jp', dir)],

        // --- Écran de correspondances PLEIN CADRE. À ne pas confondre avec le
        // plan des sorties dont le bas porte les correspondances : ce sont deux
        // écrans distincts du cycle.
        ['transfers-full', (s) => drawTransfers(s, station, clock, dir)],

        // --- Plan des sorties, composition « correspondances » : celle de la
        // circulation, sous 次は. Elle ne dépend pas de la paroi regardée.
        ['exit-transfers', (s) => drawExitTransfers(s, station, clock, dir, 2, 'next')],

        // --- Plan des sorties, composition « portes », sous まもなく. Seul
        // écran du cycle qui diffère d'une paroi à l'autre : la dalle du côté
        // qui s'ouvre dit こちら側, celle d'en face 反対側.
        ['exit-doors-this-side', (s) => drawExitDoors(s, station, clock, true, dir, 2, 'soon')],
        ['exit-doors-other-side', (s) => drawExitDoors(s, station, clock, false, dir, 2, 'soon')],
        // Les quatre phases du pictogramme de porte (vantaux + triangle de la
        // voiture du joueur) : c'est une animation, elle ne se juge pas sur une
        // image.
        ['exit-doors-anim0', (s) => drawExitDoors(s, station, clock, true, dir, 0, 'soon')],
        ['exit-doors-anim1', (s) => drawExitDoors(s, station, clock, true, dir, 1, 'soon')],
        ['exit-doors-anim2', (s) => drawExitDoors(s, station, clock, true, dir, 2, 'soon')],
        ['exit-doors-anim3', (s) => drawExitDoors(s, station, clock, true, dir, 3, 'soon')],

        // --- Avis de secteur (ne passent que sur certains intervalles).
        ['security-jp', (s) => drawSecurityNotice(s, station, clock, 'jp', dir)],
        ['security-en', (s) => drawSecurityNotice(s, station, clock, 'en', dir)],
        ['priority-seats', (s) => drawPriorityNotice(s, station, clock, dir)],
        ['manner-mode', (s) => drawPhoneManner(s, station, clock, dir)],

        // --- Information trafic : deux pages qui se suivent.
        ['traffic-jp', (s) => drawTrafficInfo(s, station, clock, 'jp', NOTICE, dir)],
        ['traffic-en', (s) => drawTrafficInfo(s, station, clock, 'en', NOTICE, dir)],

        // --- Écrans d'incident : ils remplacent toute la rotation.
        ['emergency-brake', (s) => drawEmergencyBrake(s)],
        ['emergency-suspended', (s) => drawEmergencyInfo(s)],
        ['emergency-outage', (s) => drawOutageInfo(s)],

        // --- Écran gauche, pour mémoire.
        ['weather', (s) => drawWeatherPanel(s, WX, { year: 2026, month: 4, day: 27 }, 28)],
      ];

      const out = document.getElementById('out');
      for (const [name, draw] of views) {
        const s = makeScreen(768, 432);
        draw(s);
        const fig = document.createElement('figure');
        const cap = document.createElement('figcaption');
        cap.textContent = name;
        fig.append(cap, s.g.canvas);
        s.g.canvas.dataset.view = name;
        out.append(fig);
      }
    </script>
  </body>
</html>
