# Déploiement GitHub Pages : build Vite puis publication du dossier dist.
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».

name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Lancement manuel depuis l'onglet Actions (utile pour la première mise en ligne
  # ou pour déployer une autre branche).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on n'annule pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      # Le lint et tsc ne voient pas les régressions de DONNÉES : un côté
      # d'ouverture corrigé dans DOOR_SIDE change le texte de l'annonce, donc sa
      # clé de clip, et la rame se tait à cette gare sans qu'aucun type ne
      # bronche (tests/announcementClips.test.ts est là pour ça). La suite tourne
      # donc avant le build, et non plus seulement en local.
      - name: Tests
        run: npm test

      - name: Build (tsc + vite)
        run: npm run build
        # Compteur « voyageurs en ligne » (facultatif). Renseigner ces deux
        # valeurs dans Settings → Secrets and variables → Actions pour l'activer.
        # On accepte les deux onglets : « Variables » (recommandé, la clé anon
        # est publique) OU « Secrets ». Absentes, le build réussit et le compteur
        # reste masqué.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Configuration de Pages
        uses: actions/configure-pages@v5
        with:
          # Active GitHub Pages (source « GitHub Actions ») au premier passage
          # si ce n'est pas déjà fait dans Settings → Pages.
          enablement: true

      - name: Envoi de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # LE DÉLAI DE DIX MINUTES N'EST PAS RÉGLABLE, et ça vaut d'être écrit ici
      # pour épargner l'essai à la personne suivante. `actions/deploy-pages`
      # accepte bien une entrée `timeout`, mais la borne :
      #
      #   Warning: timeout value is greater than the allowed maximum
      #           - timeout set to the maximum of 600000 milliseconds.
      #
      # Six cent mille millisecondes, soit dix minutes, et c'est un plafond en
      # dur. Le 6 août, deux mises en ligne d'affilée sont restées en
      # « deployment_in_progress » au-delà, et l'étape les a ANNULÉES.
      #
      # Ce n'est pas le poids de l'artefact : trente méga-octets compressés,
      # contre trente avant qu'on y ajoute la géographie importée - un demi pour
      # cent -, et le job de build entier (lint, 886 tests, tsc, vite, envoi)
      # tient en soixante-trois secondes. La même journée, la même taille est
      # passée en trois minutes le matin.
      #
      # Il n'y a donc rien à régler de ce côté : quand ça dépasse, c'est chez
      # GitHub, et la seule chose à faire est de relancer le workflow.
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
