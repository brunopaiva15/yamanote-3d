<!doctype html>
<!-- Page de probe DEV : le monde PLATEAU produit par le pipeline, seul.
     Sert à juger la géométrie exportée sans le wagon, sans le mur de
     soutènement du tronçon et sans la brume du jeu.

     /plateau-probe.html            → vue oblique de tout le tronçon
     /plateau-probe.html?s=650      → œil du conducteur à l'abscisse 650 m -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>plateau-probe - monde géoréférencé PLATEAU</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #10141f;
      }
      .probe-hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(12, 16, 24, 0.78);
        color: #e8eef5;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        pointer-events: none;
      }
      .probe-error {
        color: #ff9b9b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="probe-hud">chargement…</div>
    <script type="module" src="/src/dev/plateau-probe-main.ts"></script>
