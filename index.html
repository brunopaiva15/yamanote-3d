<!doctype html>
<!--
  L'anglais est la langue par défaut du document servi : c'est ce que voient les
  robots d'indexation, qui n'ont ni langue de navigateur ni localStorage.
  `src/i18n/documentMeta.ts` réécrit lang, titre, description et balises
  sociales dès que le store connaît la langue réelle du visiteur.

  Les URL absolues ci-dessous (canonique, alternates, og:url, images sociales)
  ne peuvent pas être relatives : un moteur les recopie telles quelles dans son
  index et un aperçu de partage les résout depuis un autre domaine. Elles
  pointent l'hébergement de référence (GitHub Pages) ; `tests/seo.test.mjs`
  vérifie qu'elles restent d'accord entre elles, avec robots.txt et sitemap.xml.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : la scène occupe tout l'écran, encoche comprise, et
         c'est le HUD qui se tient à l'écart via env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>Yamanote 3D - 山手線 · Ride Tokyo's Yamanote Line in 3D</title>
    <meta
      name="description"
      content="Ride Tokyo's Yamanote Line in 3D in your browser: board a JR East E235, walk the carriage, step onto the platform. Thirty stations, real announcements, no goal."
    />

    <!-- Indexation : tout ouvert, et les grands aperçus autorisés - le jeu se
         montre par l'image. max-snippet:-1 lève la limite de longueur d'extrait. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Vergasta Digital" />
    <meta name="application-name" content="Yamanote 3D" />
    <meta name="apple-mobile-web-app-title" content="Yamanote 3D" />
    <meta name="theme-color" content="#10151a" />
    <meta name="color-scheme" content="dark" />

    <!-- Une seule page, une seule URL canonique. Les trois langues ne sont pas
         des documents distincts mais le même document paramétré : elles se
         déclarent en alternates, et x-default renvoie l'URL nue, celle qui
         détecte la langue du navigateur. -->
    <link rel="canonical" href="https://brunopaiva15.github.io/yamanote-3d/" />
    <link rel="alternate" hreflang="en" href="https://brunopaiva15.github.io/yamanote-3d/?lang=en" />
    <link rel="alternate" hreflang="fr" href="https://brunopaiva15.github.io/yamanote-3d/?lang=fr" />
    <link rel="alternate" hreflang="ja" href="https://brunopaiva15.github.io/yamanote-3d/?lang=ja" />
    <link rel="alternate" hreflang="x-default" href="https://brunopaiva15.github.io/yamanote-3d/" />

    <!-- Icônes : le SVG pour les navigateurs modernes, le PNG en repli, l'icône
         opaque pour iOS. Toutes produites par `npm run seo:assets`. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="author" href="https://vergasta.ch" />

    <!-- Open Graph : ce que recopient Discord, Slack, Facebook, LinkedIn,
         Bluesky, Mastodon. og:locale suit la langue affichée (réécrite au vol) ;
         les deux autres restent déclarées en alternate. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yamanote 3D" />
    <meta property="og:url" content="https://brunopaiva15.github.io/yamanote-3d/" />
    <meta property="og:title" content="Yamanote 3D - 山手線 · Ride Tokyo's Yamanote Line in 3D" />
    <meta
      property="og:description"
      content="Ride Tokyo's Yamanote Line in 3D in your browser: board a JR East E235, walk the carriage, step onto the platform. Thirty stations, real announcements, no goal."
    />
    <meta property="og:image" content="https://brunopaiva15.github.io/yamanote-3d/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yamanote 3D - 山手線" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="ja_JP" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yamanote 3D - 山手線 · Ride Tokyo's Yamanote Line in 3D" />
    <meta
      name="twitter:description"
      content="Ride Tokyo's Yamanote Line in 3D in your browser: board a JR East E235, walk the carriage, step onto the platform. Thirty stations, real announcements, no goal."
    />
    <meta name="twitter:image" content="https://brunopaiva15.github.io/yamanote-3d/og-image.png" />
    <meta name="twitter:image:alt" content="Yamanote 3D - 山手線" />

    <!-- Données structurées. Un jeu web gratuit, ses langues, son auteur, et le
         sujet dont il parle relié à sa fiche Wikidata : c'est ce lien-là qui
         raccroche la page à l'entité « ligne Yamanote » plutôt qu'à la chaîne
         de caractères. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://brunopaiva15.github.io/yamanote-3d/#website",
            "url": "https://brunopaiva15.github.io/yamanote-3d/",
            "name": "Yamanote 3D",
            "alternateName": "山手線 3D",
            "inLanguage": ["en", "fr", "ja"],
            "publisher": { "@id": "https://vergasta.ch/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://vergasta.ch/#organization",
            "name": "Vergasta Digital",
            "url": "https://vergasta.ch"
          },
          {
            "@type": "VideoGame",
            "@id": "https://brunopaiva15.github.io/yamanote-3d/#game",
            "name": "Yamanote 3D",
            "alternateName": "山手線 3D",
            "url": "https://brunopaiva15.github.io/yamanote-3d/",
            "description": "A contemplative browser ride: you are a passenger on a JR East E235 series train on Tokyo's Yamanote Line. Thirty stations, an endless loop, no score - walk the carriage, sit down, get off onto the platform, listen to the announcements and the departure melodies.",
            "image": "https://brunopaiva15.github.io/yamanote-3d/og-image.png",
            "screenshot": "https://brunopaiva15.github.io/yamanote-3d/og-image.png",
            "genre": ["Simulation", "Walking simulator", "Train simulator"],
            "gamePlatform": "Web browser",
            "playMode": "SinglePlayer",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Any device with a WebGL 2 browser",
            "browserRequirements": "Requires JavaScript and WebGL 2",
            "inLanguage": ["en", "fr", "ja"],
            "isAccessibleForFree": true,
            "isFamilyFriendly": true,
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD",
              "availability": "https://schema.org/InStock"
            },
            "author": { "@id": "https://vergasta.ch/#organization" },
            "publisher": { "@id": "https://vergasta.ch/#organization" },
            "about": {
              "@type": "Thing",
              "name": "Yamanote Line",
              "alternateName": "山手線",
              "sameAs": [
                "https://en.wikipedia.org/wiki/Yamanote_Line",
                "https://www.wikidata.org/wiki/Q800585"
              ]
            }
          }
        ]
      }
    </script>

    <!-- Empêche un flash blanc avant le chargement de la feuille principale. -->
    <style>
      html,
      body {
        margin: 0;
        background: #10151a;
      }
    </style>
  </head>
  <body>
    <!-- Le conteneur reste volontairement vide : aucun texte ne doit flasher
         avant que React affiche l'écran d'accueil. -->
    <div id="root"></div>
    <noscript>
      <p>Yamanote 3D requires JavaScript and WebGL 2.</p>
      <p><a href="./about.html">Read about the project</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
